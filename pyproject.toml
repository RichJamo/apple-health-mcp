# Project metadata and tooling config for apple-health-mcp.
# This single file tells Python's tooling (uv, pip, pytest) what the
# project is, which Python it needs, and what packages go in its sandbox.

[project]
name = "apple-health-mcp"
version = "0.0.1"
description = "Local-first Apple Health integration for AI agents via MCP"
readme = "README.md"
requires-python = ">=3.11"
# Open-source licence is a deliberate Phase-5 decision — left unset for now
# so we don't assert a licence we haven't chosen together.
authors = [{ name = "Richard Jamieson" }]

# Runtime dependencies: none yet. The core parser and storage use only
# Python's standard library (xml, sqlite3). The MCP SDK arrives in Phase 2.
dependencies = []

# Development-only tools, installed by `uv sync` but not shipped to users.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ layout: importable code lives under src/, keeping it separate from
# tests, docs and config. This is the configuration that tells the build
# tool where the package is.
[tool.hatch.build.targets.wheel]
packages = ["src/apple_health_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP)
select = ["E", "F", "W", "I", "UP"]
# line length is the formatter's concern; don't fail the build on a long comment
ignore = ["E501"]
